<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owly</title>
</head>

<body>
  <header>
    <h1><img src="/src/img/logo-owly.svg" alt="" class="logo"> Owly</h1>
    <p>Cerca il libro che desideri</p>
  </header>

  <main>
    <form id="categoria-form">
      <label for="categoria-input">Categoria</label>
      <div class="riga-ricerca">
        <input type="text" id="categoria-input" placeholder="Es. fantasy, animali, spazio...">
        <button type="submit">Cerca libri</button>
      </div>
    </form>

    <section id="categorie-popolari">
      <h2>Categorie popolari</h2>
      <div class="griglia-categorie">
        <button type="button" class="categoria" data-categoria="animals">Animali</button>
        <button type="button" class="categoria" data-categoria="fantasy">Fantasy</button>
        <button type="button" class="categoria" data-categoria="science">Scienza</button>
        <button type="button" class="categoria" data-categoria="history">Storia</button>
        <button type="button" class="categoria" data-categoria="space">Spazio</button>
        <button type="button" class="categoria" data-categoria="music">Musica</button>
      </div>
    </section>

    <p id="messaggi" aria-live="polite"></p>

    <section id="risultati">
      <ul id="lista-libri"></ul>
    </section>

    <dialog id="dettaglio-libro">
      <button type="button" id="chiudi-dettaglio" aria-label="Chiudi">✕</button>
      <div id="dettaglio-contenuto"></div>
    </dialog>
  </main>

  <script type="module" src="/src/js/main.js"></script>
</body>

</html>
